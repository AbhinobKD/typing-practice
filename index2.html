<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>keysense</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;700;800&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0a;
    --surface: #111;
    --border: #1e1e1e;
    --text: #e8e8e8;
    --dim: #444;
    --accent: #c8f060;
    --wrong: #ff4d6d;
    --correct: #4dffb4;
    --pending: #555;
    --cursor: #c8f060;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 48px;
    padding: 40px;
  }

  header {
    position: fixed;
    top: 32px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 32px;
  }

  .logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 14px;
    letter-spacing: 0.3em;
    color: var(--accent);
    text-transform: uppercase;
  }

  .stats-bar {
    display: flex;
    gap: 24px;
    align-items: center;
  }

  .stat {
    font-size: 11px;
    color: var(--dim);
    letter-spacing: 0.1em;
  }

  .stat span {
    color: var(--text);
    margin-left: 6px;
  }

  /* heatmap */
  .heatmap-wrap {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: center;
  }

  .heatmap-label {
    font-size: 10px;
    color: var(--dim);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .kb-row {
    display: flex;
    gap: 5px;
  }

  .kb-key {
    width: 30px;
    height: 30px;
    border-radius: 4px;
    background: var(--surface);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    color: var(--dim);
    transition: all 0.4s ease;
    position: relative;
  }

  .kb-key.heat-1 { background: #1a2a10; border-color: #2a4420; color: #7ab840; }
  .kb-key.heat-2 { background: #243510; border-color: #3a5518; color: #9ed040; }
  .kb-key.heat-3 { background: #7a9920; border-color: #9ec030; color: #c8f060; }
  .kb-key.heat-bad { background: #2a0a12; border-color: #441020; color: #ff4d6d; animation: pulse-bad 1.5s ease infinite; }

  @keyframes pulse-bad {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,77,109,0); }
    50% { box-shadow: 0 0 8px 2px rgba(255,77,109,0.3); }
  }

  /* typing area */
  .typing-container {
    width: min(680px, 90vw);
    display: flex;
    flex-direction: column;
    gap: 32px;
  }

  .mode-label {
    font-size: 10px;
    letter-spacing: 0.3em;
    color: var(--dim);
    text-transform: uppercase;
    text-align: center;
    transition: color 0.3s;
  }

  .mode-label.targeting {
    color: var(--accent);
  }

  .words-display {
    position: relative;
    font-size: 28px;
    line-height: 1.8;
    letter-spacing: 0.05em;
    min-height: 110px;
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-content: flex-start;
  }

  .word {
    position: relative;
    display: inline-flex;
  }

  .char {
    color: var(--pending);
    transition: color 0.1s;
    position: relative;
  }

  .char.correct { color: var(--correct); }
  .char.wrong { color: var(--wrong); text-decoration: underline; text-decoration-color: rgba(255,77,109,0.5); }
  .char.active { color: var(--text); }

  .char.cursor::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: 2px;
    width: 100%;
    height: 2px;
    background: var(--cursor);
    animation: blink 1s step-end infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  .input-field {
    position: absolute;
    opacity: 0;
    pointer-events: none;
    width: 1px;
    height: 1px;
  }

  .click-hint {
    text-align: center;
    font-size: 12px;
    color: var(--dim);
    letter-spacing: 0.15em;
  }

  /* weak key callout */
  .weak-callout {
    position: fixed;
    top: 32px;
    right: 40px;
    font-size: 11px;
    color: var(--dim);
    letter-spacing: 0.1em;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
    opacity: 0;
    transition: opacity 0.5s;
  }

  .weak-callout.visible { opacity: 1; }

  .weak-keys-display {
    display: flex;
    gap: 6px;
  }

  .weak-badge {
    background: rgba(255,77,109,0.1);
    border: 1px solid rgba(255,77,109,0.3);
    border-radius: 3px;
    padding: 3px 8px;
    font-size: 13px;
    color: var(--wrong);
    font-weight: 500;
  }

  /* completion flash */
  .flash {
    position: fixed;
    inset: 0;
    background: var(--accent);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.1s;
  }

  .flash.on { opacity: 0.04; }

  /* wpm ring */
  .wpm-display {
    position: fixed;
    top: 50%;
    right: 48px;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .wpm-num {
    font-family: 'Syne', sans-serif;
    font-size: 36px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
    transition: all 0.3s;
  }

  .wpm-label {
    font-size: 9px;
    letter-spacing: 0.3em;
    color: var(--dim);
    text-transform: uppercase;
  }

  .acc-display {
    font-size: 12px;
    color: var(--dim);
  }

  .acc-display span { color: var(--text); }
</style>
</head>
<body>

<div class="flash" id="flash"></div>

<header>
  <div class="logo">keysense</div>
  <div class="stats-bar">
    <div class="stat">words <span id="stat-words">0</span></div>
    <div class="stat">streak <span id="stat-streak">0</span></div>
  </div>
</header>

<div class="weak-callout" id="weak-callout">
  <div style="font-size:10px;color:var(--dim);letter-spacing:0.15em;">WEAK KEYS</div>
  <div class="weak-keys-display" id="weak-keys-display"></div>
</div>

<div class="wpm-display">
  <div class="wpm-num" id="wpm-num">—</div>
  <div class="wpm-label">wpm</div>
  <div class="acc-display">acc <span id="acc-num">—</span></div>
</div>

<div class="typing-container">
  <div class="mode-label" id="mode-label">warming up</div>
  <div class="words-display" id="words-display" tabindex="0">
    <input type="text" class="input-field" id="hidden-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
  </div>
  <div class="click-hint" id="click-hint">click to begin</div>
</div>

<div class="heatmap-wrap">
  <div class="heatmap-label">key accuracy</div>
  <div id="keyboard"></div>
</div>

<script>
const ROWS = [
  ['q','w','e','r','t','y','u','i','o','p'],
  ['a','s','d','f','g','h','j','k','l'],
  ['z','x','c','v','b','n','m']
];

const WORD_BANK = {
  warmup: ["the","and","for","are","but","not","you","all","can","was","her","one","our","out","day","get","has","him","his","how","now","its","let","man","new","old","see","two","way","who","act","age","ago","air","any","ask","bad","big","but","buy","car","cut","did","end","few","fly","far","gay","god","got","hit","hot","ice","joy","key","kid","law","lie","low","map","may","mix","mom","net","nor","own","pay","put","ran","ran","run","sat","say","set","sir","six","ten","try","use","war","win","won","yet","you"],
  general: ["about","after","again","along","among","another","answer","around","because","before","between","beyond","bright","build","carry","change","choose","close","color","could","cover","cross","daily","dance","death","decision","deep","deliver","design","different","direct","dream","drive","during","earth","eight","either","else","emerge","emotion","enough","enter","every","exist","expect","explain","extend","extra","fabric","face","faith","family","feel","field","figure","final","first","fixed","floor","focus","follow","force","form","found","frame","front","fully","given","glass","globe","going","grace","grand","grant","great","green","group","guide","happy","heart","heavy","hence","house","human","humor","ideal","image","impact","indeed","inner","input","issue","items","joint","judge","keeps","known","large","later","layer","lead","learn","leave","level","light","limit","local","logic","look","loved","lower","magic","major","maker","match","maybe","means","merge","might","model","money","month","moved","music","named","never","night","north","noted","often","order","other","ought","outer","owned","paint","peace","phase","phone","place","plain","plane","plant","point","power","press","price","pride","prior","proof","proud","prove","queen","quick","quite","quote","raise","range","rapid","ratio","reach","ready","realm","refer","reign","relay","reply","right","river","round","royal","ruler","scale","scene","scope","score","sense","serve","seven","shall","share","shift","short","sight","since","sixth","skill","sleep","small","smart","smile","solid","solve","south","space","speak","speed","spend","split","stand","start","state","still","stock","story","study","style","super","table","teach","theme","think","three","throw","tight","timer","title","today","total","touch","tough","trace","trade","track","train","trend","trial","tried","trust","truth","twice","under","union","unity","until","upper","usual","value","video","views","vital","voice","watch","water","where","which","while","white","whole","world","worry","worst","worth","would","yield","young","youth"]
};

// words heavy in specific letters
function wordsForLetter(letter) {
  const all = [...WORD_BANK.general, ...WORD_BANK.warmup];
  // prefer words starting with or containing many of that letter
  const scored = all.map(w => {
    const count = [...w].filter(c => c === letter).length;
    const starts = w[0] === letter ? 3 : 0;
    return { w, score: count * 2 + starts };
  }).filter(x => x.score > 0).sort((a, b) => b.score - a.score);
  return scored.slice(0, 30).map(x => x.w);
}

// State
let keyStats = {}; // letter -> { attempts, errors }
let allKeys = 'abcdefghijklmnopqrstuvwxyz'.split('');
allKeys.forEach(k => keyStats[k] = { attempts: 0, errors: 0 });

let words = [];
let currentWordIdx = 0;
let currentCharIdx = 0;
let typed = [];
let wordTyped = [];
let sessionStart = null;
let totalChars = 0;
let errorChars = 0;
let wordCount = 0;
let streak = 0;
let wpm = 0;
let mode = 'warmup'; // 'warmup' | 'targeting'
let roundsCompleted = 0;
let active = false;

const display = document.getElementById('words-display');
const hiddenInput = document.getElementById('hidden-input');
const clickHint = document.getElementById('click-hint');
const modeLabel = document.getElementById('mode-label');
const weakCallout = document.getElementById('weak-callout');
const weakKeysDisplay = document.getElementById('weak-keys-display');
const flash = document.getElementById('flash');
const wpmNum = document.getElementById('wpm-num');
const accNum = document.getElementById('acc-num');
const statWords = document.getElementById('stat-words');
const statStreak = document.getElementById('stat-streak');

// Build keyboard heatmap
function buildKeyboard() {
  const kb = document.getElementById('keyboard');
  kb.innerHTML = '';
  ROWS.forEach(row => {
    const rowEl = document.createElement('div');
    rowEl.className = 'kb-row';
    if (ROWS.indexOf(row) === 1) rowEl.style.marginLeft = '15px';
    if (ROWS.indexOf(row) === 2) rowEl.style.marginLeft = '30px';
    row.forEach(k => {
      const el = document.createElement('div');
      el.className = 'kb-key';
      el.id = 'kb-' + k;
      el.textContent = k;
      rowEl.appendChild(el);
    });
    kb.appendChild(rowEl);
  });
}

function updateKeyboard() {
  allKeys.forEach(k => {
    const el = document.getElementById('kb-' + k);
    if (!el) return;
    const s = keyStats[k];
    if (s.attempts === 0) { el.className = 'kb-key'; return; }
    const acc = 1 - s.errors / s.attempts;
    if (acc < 0.7) el.className = 'kb-key heat-bad';
    else if (acc < 0.85) el.className = 'kb-key heat-1';
    else if (acc < 0.95) el.className = 'kb-key heat-2';
    else el.className = 'kb-key heat-3';
  });
}

function getWeakKeys() {
  return allKeys
    .filter(k => keyStats[k].attempts >= 3)
    .map(k => ({ k, acc: 1 - keyStats[k].errors / keyStats[k].attempts }))
    .sort((a, b) => a.acc - b.acc)
    .filter(x => x.acc < 0.9)
    .slice(0, 3)
    .map(x => x.k);
}

function pickWords(count = 12) {
  const weak = getWeakKeys();
  if (weak.length === 0 || roundsCompleted < 2) {
    // warmup
    mode = 'warmup';
    modeLabel.textContent = 'warming up — type these words';
    modeLabel.className = 'mode-label';
    const pool = [...WORD_BANK.warmup, ...WORD_BANK.general];
    return shuffle(pool).slice(0, count);
  } else {
    mode = 'targeting';
    // gather words for each weak key
    let pool = [];
    weak.forEach(k => pool.push(...wordsForLetter(k)));
    pool = [...new Set(pool)];
    if (pool.length < count) pool.push(...shuffle(WORD_BANK.general));
    modeLabel.textContent = `targeting: ${weak.join(' · ')}`;
    modeLabel.className = 'mode-label targeting';
    updateWeakCallout(weak);
    return shuffle(pool).slice(0, count);
  }
}

function updateWeakCallout(weak) {
  if (weak.length === 0) { weakCallout.className = 'weak-callout'; return; }
  weakCallout.className = 'weak-callout visible';
  weakKeysDisplay.innerHTML = weak.map(k => `<div class="weak-badge">${k}</div>`).join('');
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function renderWords() {
  // remove old word spans, keep input
  const spans = display.querySelectorAll('.word');
  spans.forEach(s => s.remove());

  words.forEach((word, wi) => {
    const wordEl = document.createElement('div');
    wordEl.className = 'word';
    wordEl.id = 'word-' + wi;

    [...word].forEach((ch, ci) => {
      const span = document.createElement('span');
      span.className = 'char';
      span.id = `c-${wi}-${ci}`;
      span.textContent = ch;
      if (wi === currentWordIdx && ci === currentCharIdx) span.classList.add('cursor');
      wordEl.appendChild(span);
    });

    // typed chars
    if (wordTyped[wi]) {
      [...wordTyped[wi]].forEach((ch, ci) => {
        const span = wordEl.children[ci];
        if (!span) return;
        if (ch === words[wi][ci]) span.className = 'char correct';
        else span.className = 'char wrong';
      });
    }
    display.insertBefore(wordEl, hiddenInput);
  });
  updateCursor();
}

function updateCursor() {
  document.querySelectorAll('.char.cursor').forEach(el => el.classList.remove('cursor'));
  const el = document.getElementById(`c-${currentWordIdx}-${currentCharIdx}`);
  if (el) el.classList.add('cursor');
}

function updateChar(wi, ci, correct) {
  const el = document.getElementById(`c-${wi}-${ci}`);
  if (!el) return;
  el.className = 'char ' + (correct ? 'correct' : 'wrong');
}

function flashScreen() {
  flash.className = 'flash on';
  setTimeout(() => flash.className = 'flash', 100);
}

function nextRound() {
  roundsCompleted++;
  words = pickWords(12);
  wordTyped = new Array(words.length).fill('');
  currentWordIdx = 0;
  currentCharIdx = 0;
  renderWords();
  hiddenInput.value = '';
}

function calcWPM() {
  if (!sessionStart) return 0;
  const mins = (Date.now() - sessionStart) / 60000;
  return Math.round((totalChars / 5) / mins);
}

hiddenInput.addEventListener('input', e => {
  if (!active) return;
  if (!sessionStart) sessionStart = Date.now();

  const val = hiddenInput.value;

  // space = next word
  if (val.endsWith(' ')) {
    const typed = val.trim();
    wordTyped[currentWordIdx] = typed;
    // score remaining chars
    const word = words[currentWordIdx];
    [...word].forEach((ch, ci) => {
      const typedCh = typed[ci];
      keyStats[ch].attempts++;
      if (typedCh !== ch) keyStats[ch].errors++;
    });
    // check if correct
    if (typed === word) { streak++; wordCount++; }
    else { streak = 0; wordCount++; }

    totalChars += typed.length + 1;
    currentWordIdx++;
    currentCharIdx = 0;
    hiddenInput.value = '';

    statWords.textContent = wordCount;
    statStreak.textContent = streak;
    wpm = calcWPM();
    wpmNum.textContent = wpm || '—';
    const acc = totalChars > 0 ? Math.round(((totalChars - errorChars) / totalChars) * 100) : 100;
    accNum.textContent = acc + '%';
    updateKeyboard();

    if (currentWordIdx >= words.length) {
      flashScreen();
      nextRound();
      return;
    }
    renderWords();
    return;
  }

  // track current word typing
  const word = words[currentWordIdx];
  wordTyped[currentWordIdx] = val;
  currentCharIdx = val.length;

  // live color
  [...val].forEach((ch, ci) => {
    const correct = ch === word[ci];
    updateChar(currentWordIdx, ci, correct);
    if (ci === val.length - 1) {
      // just typed this char
      if (word[ci]) {
        keyStats[word[ci]].attempts++;
        if (!correct) { keyStats[word[ci]].errors++; errorChars++; }
      }
    }
  });

  // reset chars beyond typed
  for (let ci = val.length; ci < word.length; ci++) {
    const el = document.getElementById(`c-${currentWordIdx}-${ci}`);
    if (el) el.className = 'char';
  }

  updateCursor();
});

hiddenInput.addEventListener('keydown', e => {
  if (e.key === 'Backspace') {
    // handled by input event
  }
});

display.addEventListener('click', () => {
  hiddenInput.focus();
  active = true;
  clickHint.style.opacity = '0';
});

hiddenInput.addEventListener('focus', () => {
  active = true;
  clickHint.style.opacity = '0';
});

hiddenInput.addEventListener('blur', () => {
  clickHint.style.opacity = '1';
  clickHint.textContent = 'click to resume';
});

// init
buildKeyboard();
words = pickWords(12);
wordTyped = new Array(words.length).fill('');
renderWords();
</script>
</body>
</html>
